<!DOCTYPE html>
<html lang="en">
<head>
    <title>Over the Wintry</title>
    <meta charset="UTF-8">
<link rel="stylesheet" href="css/style.css">
</head>
    
<body>
   <div class="container">

    <div class="image-section">

        <img src="img/winter-forest.jpg" alt="Winter forest">

        <div class="poem-overlay">
            <h1>Over the Wintry</h1>
            <h2>By Natsume Soseki</h2>
            <p>
                Over the wintry<br>
                Forest, winds howl in rage<br>
                With no leaves to blow.
            </p>
     
<!-- I chose palatino because its traditional serif fits the cold and quiet feeling of the haiku.-->
        </div>
        
       </div>

    </div>
</body>
</html>
